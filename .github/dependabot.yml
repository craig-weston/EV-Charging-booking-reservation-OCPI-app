# Dependency updates. Also turn on Dependabot alerts and security updates in the repository's
# Settings → Code security (security updates open pull requests as soon as an advisory is published).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      build-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
